name: CI/CD Pipeline for Llama AI Telegram Bot

on:
  push:
    branches:
      - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.PORT }}  # Опционально, по умолчанию 22
        script: |
          echo "Starting deployment to $HOST:${{ secrets.BOT_PATH }}"
          if [ ! -d ${{ secrets.BOT_PATH }} ]; then
            echo "Creating directory ${{ secrets.BOT_PATH }}"
            mkdir -p ${{ secrets.BOT_PATH }} || { echo 'Failed to create directory'; exit 1; }
          else
            echo "Directory ${{ secrets.BOT_PATH }} already exists"
          fi
          cd ${{ secrets.BOT_PATH }} || { echo 'Failed to enter directory'; exit 1; }
          echo "Copying files from GitHub to ${{ secrets.BOT_PATH }}"
          git pull origin prod || { echo 'Git pull failed'; exit 1; }
          echo "Checking virtual environment"
          if [ ! -d venv ]; then
            echo "Creating new virtual environment"
            python3.11 -m venv venv || { echo 'Failed to create venv'; exit 1; }
          else
            echo "Virtual environment exists, skipping creation"
          fi
          echo "Activating virtual environment"
          source venv/bin/activate
          echo "Upgrading pip"
          pip install --upgrade pip || { echo 'Failed to upgrade pip'; exit 1; }
          echo "Installing dependencies"
          pip install --upgrade --force-reinstall -r requirements.txt || { echo 'Failed to install dependencies'; exit 1; }
          echo "Loading environment variables from .env"
          set -a && source .env && set +a || { echo 'Failed to load .env'; exit 1; }
          echo "Restarting service"
          systemctl restart llama-ai-bot.service || { echo 'Failed to restart service'; exit 1; }
          echo "Deployment completed successfully"
          systemctl status llama-ai-bot.service --no-pager
      env:
        HOST: ${{ secrets.HOST }}
        BOT_PATH: ${{ secrets.BOT_PATH }}
