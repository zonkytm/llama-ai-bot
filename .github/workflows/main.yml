name: CI/CD Pipeline for Llama AI Telegram Bot

on:
  push:
    branches:
      - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Add SSH key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts
        env:
          REMOTE_HOST: ${{ secrets.HOST }}

      - name: Deploy to server
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          REMOTE_USER: ${{ secrets.USER }}
          REMOTE_HOST: ${{ secrets.HOST }}
          BOT_PATH: ${{ secrets.BOT_PATH }}
          PORT: ${{ secrets.PORT }}  # Добавляем порт как переменную для отладки
        run: |
          echo "Debug: REMOTE_HOST=$REMOTE_HOST"
          echo "Debug: REMOTE_USER=$REMOTE_USER"
          echo "Debug: BOT_PATH=$BOT_PATH"
          echo "Debug: PORT=$PORT"
          sudo apt-get update
          sudo apt-get install -y sshpass openssh-client
          echo "Attempting SSH connection..."
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$PORT" "$REMOTE_USER@$REMOTE_HOST" << 'EOF'
            echo "Connected to server, current directory: $(pwd)"
            cd "$BOT_PATH" || { echo "Error: Directory $BOT_PATH not found"; exit 1; }
            echo "Pulling latest changes from prod branch..."
            git fetch origin
            git checkout prod
            git pull origin prod
            # Проверяем, существует ли venv, и создаём только если нет
            if [ ! -d venv ]; then
              echo "Creating virtual environment..."
              python3.11 -m venv venv
            fi
            source venv/bin/activate
            pip install --upgrade pip
            pip install --upgrade --force-reinstall -r requirements.txt
            # Загружаем переменные из .env (если используется)
            if [ -f .env ]; then
              echo "Loading .env file..."
              set -a && source .env && set +a
            fi
            echo "Reloading systemd daemon..."
            sudo systemctl daemon-reload
            echo "Restarting service llama-ai-bot.service..."
            sudo systemctl restart llama-ai-bot.service
            echo "Checking service status..."
            sudo systemctl status llama-ai-bot.service --no-pager
          EOF