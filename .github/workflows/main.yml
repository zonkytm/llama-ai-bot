name: Deploy Telegram Bot

# Триггеры: запуск при пушах в ветку prod или при создании тегов
on:
  push:
    branches:
      - prod
  workflow_dispatch: # Позволяет запускать вручную

# Ограничение: секреты и переменные не передаются при pull request из форка
env:
  BOT_PATH: ${{ secrets.BOT_PATH }}
  HOST: ${{ secrets.HOST }}
  PORT: ${{ secrets.PORT }}
  SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
  USERNAME: ${{ secrets.USERNAME }}
  SERVICE_NAME: llama-ai-bot

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Проверка кода из репозитория (ветка prod)
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: prod # Указываем ветку prod

      # Настройка Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Установка зависимостей
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ${{ env.BOT_PATH }}

      # Установка SSH-клиента
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client sshpass

      # Деплой на сервер через SSH
      - name: Deploy to Server
        run: |
          echo "Connecting to $HOST..."
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $USERNAME@$HOST -p $PORT << 'EOF'
            cd $BOT_PATH
            echo "Pulling latest changes from prod branch..."
            git fetch origin
            git checkout prod
            git pull origin prod
            echo "Installing dependencies..."
            python3.11 -m pip install -r requirements.txt -q
            echo "Reloading systemd daemon..."
            sudo systemctl daemon-reload
            echo "Restarting service $SERVICE_NAME..."
            sudo systemctl restart $SERVICE_NAME
            echo "Checking service status..."
            sudo systemctl status $SERVICE_NAME --no-pager
          EOF
